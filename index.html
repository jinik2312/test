<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI해봄마루 공유자료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2F0; --paper:#FFFFFF; --ink:#1E2A2C; --muted:#5B6B6C;
  --line:#C9D4D0; --celadon:#2F6E5F; --celadon-soft:#DCE9E4; --seal:#B8352B;
  --serif:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141B1C; --paper:#1C2526; --ink:#E4ECEA; --muted:#9AAAA8;
    --line:#314042; --celadon:#7FC3AE; --celadon-soft:#23352F; --seal:#E0685C;
  }
}
:root[data-theme="dark"]{
  --bg:#141B1C; --paper:#1C2526; --ink:#E4ECEA; --muted:#9AAAA8;
  --line:#314042; --celadon:#7FC3AE; --celadon-soft:#23352F; --seal:#E0685C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--celadon);outline-offset:3px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* Hero */
header.hero{padding:64px 0 40px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(44px,8vw,88px);line-height:1.05;letter-spacing:-0.02em;margin:0}
.hero p{margin:16px 0 0;font-size:18px;color:var(--muted);max-width:36em}
/* 결재란 */
.sign{display:grid;grid-template-columns:repeat(3,84px);border:1.5px solid var(--ink);background:var(--paper);font-size:13px;text-align:center}
.sign div{border-left:1px solid var(--ink)}
.sign div:first-child{border-left:0}
.sign span{display:block;padding:4px 0;border-bottom:1px solid var(--ink);color:var(--muted)}
.sign b{display:flex;align-items:center;justify-content:center;height:64px;font-family:var(--serif);font-size:26px}
.sign .seal b{color:var(--seal)}
.sign .seal b i{font-style:normal;display:inline-grid;place-items:center;width:46px;height:46px;border:2px solid var(--seal);border-radius:50%;font-size:14px;line-height:1.1;transform:rotate(-8deg)}

/* Sections */
section{padding:48px 0}
h2{font-family:var(--serif);font-size:28px;margin:0 0 6px;font-weight:700}
.lead{margin:0 0 24px;color:var(--muted)}

/* Tools */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.tool{display:flex;flex-direction:column;gap:2px;padding:18px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-decoration:none;background:var(--paper)}
.tool:hover{background:var(--celadon-soft)}
.tool strong{font-weight:600;font-size:17px}
.tool small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.tool.extra strong::after{content:" (GitHub)";font-weight:400;color:var(--muted);font-size:14px}

/* Tasks */
.tasks-layout{display:grid;grid-template-columns:220px 1fr;gap:40px;align-items:start}
nav.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px)}
nav.index ol{list-style:none;margin:0;padding:0;counter-reset:n}
nav.index li{counter-increment:n}
nav.index a{display:flex;gap:10px;padding:6px 0;text-decoration:none;color:var(--muted);font-size:15px}
nav.index a::before{content:counter(n);width:22px;font-family:var(--serif);color:var(--celadon);font-weight:700;text-align:right}
nav.index a:hover{color:var(--ink)}
.task{display:grid;grid-template-columns:64px 1fr;gap:0 20px;padding:28px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:0}
.task .num{font-family:var(--serif);font-size:44px;line-height:1;color:var(--celadon);font-weight:700}
.task h3{margin:4px 0 14px;font-size:21px;font-weight:600}
.files{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.file{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:6px;text-decoration:none}
.file:hover{border-color:var(--celadon)}
.ext{grid-row:span 2;display:grid;place-items:center;width:46px;height:46px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.02em;color:#fff}
.ext.docx{background:#2B5797}.ext.xlsx{background:#1E7145}.ext.txt{background:#6B6F73}
.file .role{font-size:13px;color:var(--muted)}
.file .name{font-weight:500;line-height:1.35}


.prompt{margin:0 0 14px;border-left:3px solid var(--celadon);background:var(--celadon-soft);border-radius:0 6px 6px 0;padding:12px 16px}
.prompt-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.prompt-title{font-weight:600}
.copy{font:inherit;font-size:14px;font-weight:600;padding:6px 14px;border-radius:4px;border:1px solid var(--celadon);background:var(--paper);color:var(--celadon);cursor:pointer}
.copy:hover{background:var(--celadon);color:var(--paper)}
.copy.done{background:var(--celadon);color:var(--paper)}
.prompt summary{cursor:pointer;margin-top:8px;font-size:14px;color:var(--muted);width:max-content}
.prompt pre{margin:10px 0 2px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-family:var(--sans);font-size:15px;line-height:1.7;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:14px 16px;max-height:420px;overflow:auto}
footer{padding:32px 0 48px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}

@media (max-width:800px){
  header.hero{padding:40px 0 28px}
  .hero-grid{grid-template-columns:1fr}
  .tasks-layout{grid-template-columns:1fr}
  nav.index{display:none}
  .files{grid-template-columns:1fr}
  .task{grid-template-columns:44px 1fr;gap:0 14px}
  .task .num{font-size:32px}
}
</style>
</head>

<header class="hero">
  <div class="wrap hero-grid">
    <div>
      <h1>AI해봄마루<br>공유자료</h1>
      <p>업무효율화를 위한 생성형 AI 실습에 쓰는 도구 링크와 실습 파일을 한곳에 모았습니다. 과제별 프롬프트를 복사하고 실습 파일을 내려받아 바로 따라 해 보세요.</p>

</header>

<main>

        <div id="task-list"></div>

    </div>
  </section>
</main>

<footer class="wrap">

function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ok=document.execCommand("copy");}catch(e){}
  ta.remove(); return ok;
}
document.getElementById("task-list").addEventListener("click", async e=>{
  const b=e.target.closest(".copy"); if(!b) return;
  const text=tasks[+b.dataset.i][3];
  let ok=false;
  try{ await navigator.clipboard.writeText(text); ok=true; }catch(err){ ok=fallbackCopy(text); }
  b.textContent = ok ? "복사됨" : "복사 실패: 펼쳐서 직접 선택하세요";
  b.classList.toggle("done", ok);
  setTimeout(()=>{ b.textContent="프롬프트 복사"; b.classList.remove("done"); }, 2000);
});

document.getElementById("c-tools").textContent = tools.length;
